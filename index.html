<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Acuario - Obras Originales e Independientes</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p.subtitulo {
            text-align: center;
            color: #8b949e;
            margin-bottom: 40px;
        }
        .lista-novelas {
            list-style: none;
            padding: 0;
        }
        .novela-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .novela-item:hover {
            border-color: #58a6ff;
        }
        .novela-item a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
        }
        .novela-item a:hover {
            text-decoration: underline;
        }
        .descripcion {
            color: #8b949e;
            margin-top: 8px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <h1>Editorial Acuario</h1>
    <p class="subtitulo">Espacio oficial de obras originales y autores independientes</p>

    <ul class="lista-novelas">
        <li class="novela-item">
            <a href="mi-primera-novela/index.html">📖 Título de tu Primera Novela</a>
            <div class="descripcion">Sinopsis o descripción breve de la obra independiente.</div>
        </li>
    </ul>

</body>
</html>
