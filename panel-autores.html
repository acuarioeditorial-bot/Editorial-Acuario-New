<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de autor | Editorial Acuario</title><style>:root{--ink:#211d31;--muted:#625d72;--line:#e9e2ff;--primary:#684df0;--success:#1a956d;--danger:#c43f55}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f4ff,#fff);color:var(--ink);font-family:system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:#f7f4ffee;position:sticky;top:0;z-index:2}nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.btn.light{background:#fff;color:var(--primary);border:1px solid var(--line)}main{padding:42px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 26px #5142b50d}form{display:grid;gap:11px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:120px;resize:vertical}.status{min-height:24px;font-weight:700}.success{color:var(--success)}.error{color:var(--danger)}.item{padding:15px;border:1px solid var(--line);border-radius:14px;background:#faf9ff;margin-top:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.small{color:var(--muted);font-size:.88rem}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><header><nav class="wrap"><span class="brand">Editorial Acuario · Panel de autor</span><a class="btn light" href="index.html">Volver al inicio</a></nav></header><main><div class="wrap grid"><section class="card"><h1>Crear novela</h1><form id="novel-form"><input name="title" required placeholder="Título"><input name="genre" required placeholder="Género"><input name="slug" required placeholder="slug-unico"><textarea name="synopsis" required placeholder="Sinopsis"></textarea><input name="cover_path" placeholder="URL de portada opcional"><button class="btn">Guardar borrador</button><div id="novel-status" class="status"></div></form></section><section class="card"><h2>Mis novelas</h2><div id="novel-list">Cargando…</div></section></div><div class="wrap" style="margin-top:22px"><section class="card"><h2>Capítulos</h2><p class="small">Selecciona una novela, escribe el capítulo y guárdalo como borrador, programado o publicado.</p><form id="chapter-form"><select id="novel-select" required><option value="">Selecciona una novela</option></select><input name="chapter_number" type="number" min="1" required placeholder="Número del capítulo"><input name="title" required placeholder="Título del capítulo"><textarea name="content" required placeholder="Contenido del capítulo"></textarea><select name="status"><option value="draft">Borrador</option><option value="published">Publicar ahora</option><option value="scheduled">Programar</option></select><input name="scheduled_at" type="datetime-local"><button class="btn">Guardar capítulo</button><div id="chapter-status" class="status"></div></form><div id="chapter-list" style="margin-top:18px"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const client=supabase.createClient(window.supabaseConfig.url,window.supabaseConfig.anonKey,{auth:{persistSession:true,autoRefreshToken:true}}),novelForm=document.getElementById('novel-form'),chapterForm=document.getElementById('chapter-form'),select=document.getElementById('novel-select');let user,novels=[];const msg=(id,text,type='')=>{const e=document.getElementById(id);e.textContent=text;e.className='status '+type};async function session(){const{data}=await client.auth.getSession();if(!data.session){location.href='acceso.html';return null}user=data.session.user;return user}async function load(){if(!await session())return;const r=await client.from('novels').select('*').eq('author_id',user.id).order('created_at',{ascending:false});if(r.error){msg('novel-status',r.error.message,'error');return}novels=r.data||[];select.innerHTML='<option value="">Selecciona una novela</option>'+novels.map(n=>`<option value="${n.id}">${n.title} (${n.status})</option>`).join('');document.getElementById('novel-list').innerHTML=novels.length?novels.map(n=>`<div class="item"><strong>${n.title}</strong><div class="small">${n.genre} · Estado: ${n.status}</div><div class="actions"><button class="btn" onclick="publishNovel('${n.id}')">Publicar novela</button><button class="btn light" onclick="selectNovel('${n.id}')">Añadir capítulo</button></div></div>`).join(''):'<p class="small">Todavía no tienes novelas.</p>';loadChapters()}
window.selectNovel=id=>{select.value=id;document.getElementById('chapter-form').scrollIntoView({behavior:'smooth'})};window.publishNovel=async id=>{const r=await client.from('novels').update({status:'published',published_at:new Date().toISOString()}).eq('id',id).eq('author_id',user.id);if(r.error)msg('novel-status',r.error.message,'error');else{msg('novel-status','Novela publicada. Ya puede aparecer en el catálogo.','success');load()}};async function loadChapters(){const id=select.value;if(!id){document.getElementById('chapter-list').innerHTML='';return}const r=await client.from('chapters').select('*').eq('novel_id',id).order('chapter_number');document.getElementById('chapter-list').innerHTML=(r.data||[]).map(c=>`<div class="item"><strong>Capítulo ${c.chapter_number}: ${c.title}</strong><div class="small">Estado: ${c.status}</div></div>`).join('')||'<p class="small">Sin capítulos todavía.</p>'}select.addEventListener('change',loadChapters);novelForm.addEventListener('submit',async e=>{e.preventDefault();if(!await session())return;const d=new FormData(e.currentTarget),p={author_id:user.id,title:d.get('title').trim(),genre:d.get('genre').trim(),slug:d.get('slug').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-'),synopsis:d.get('synopsis').trim(),cover_path:d.get('cover_path').trim()||null,status:'draft'};const r=await client.from('novels').insert(p);if(r.error)msg('novel-status',r.error.message,'error');else{e.currentTarget.reset();msg('novel-status','Borrador guardado.','success');load()}});chapterForm.addEventListener('submit',async e=>{e.preventDefault();if(!await session())return;const d=new FormData(e.currentTarget),status=d.get('status'),p={novel_id:select.value,chapter_number:Number(d.get('chapter_number')),title:d.get('title').trim(),content:d.get('content').trim(),status,scheduled_at:d.get('scheduled_at')?new Date(d.get('scheduled_at')).toISOString():null,published_at:status==='published'?new Date().toISOString():null};if(!p.novel_id){msg('chapter-status','Selecciona una novela.','error');return}const r=await client.from('chapters').insert(p);if(r.error)msg('chapter-status',r.error.message,'error');else{e.currentTarget.reset();msg('chapter-status','Capítulo guardado correctamente.','success');loadChapters()}});load();
</script></body></html>
