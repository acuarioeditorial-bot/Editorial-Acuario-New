<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perfil | Editorial Acuario</title>
  <style>
    :root { --bg:#f7f4ff; --ink:#211d31; --muted:#625d72; --line:#e9e2ff; --primary:#684df0; --primary-dark:#4e36d4; --success:#1ea97a; --danger:#d75a6b; --panel:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; color:var(--ink); background:linear-gradient(180deg,#f7f4ff,#fff); }
    .wrap { width:min(960px,calc(100% - 30px)); margin:0 auto; }
    header { border-bottom:1px solid var(--line); background:rgba(247,244,255,.95); position:sticky; top:0; }
    nav { min-height:72px; display:flex; align-items:center; justify-content:space-between; }
    a { color:var(--primary-dark); text-decoration:none; font-weight:800; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 12px 26px rgba(81,66,181,.06); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; padding:42px 0; }
    form { display:grid; gap:12px; }
    input, textarea, select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font:inherit; }
    textarea { min-height:120px; resize:vertical; }
    .btn { display:inline-flex; align-items:center; justify-content:center; background:var(--primary); color:#fff; border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer; }
    .btn.secondary { background:#fff; color:var(--primary-dark); border:1px solid var(--line); }
    .form-status { min-height:24px; font-weight:700; }
    .form-status.success { color:var(--success); }
    .form-status.warning { color:#8a6d00; }
    .form-status.error { color:var(--danger); }
    .meta { color:var(--muted); font-size:.9rem; }
    .avatar { width:72px; height:72px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(135deg,#684df0,#a68cff); color:#fff; font-weight:900; font-size:1.5rem; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <nav class="wrap">
      <div><strong>Editorial Acuario</strong></div>
      <a href="index.html">Volver al inicio</a>
    </nav>
  </header>

  <main class="wrap grid">
    <section class="card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div class="avatar" id="profile-avatar">A</div>
        <div>
          <h1 style="margin:0;">Perfil</h1>
          <div class="meta">Actualiza tu identidad pública.</div>
        </div>
      </div>

      <form id="profile-form">
        <label>
          <span>Nombre visible</span>
          <input id="profile-display-name" name="display_name" type="text" placeholder="Tu nombre o pseudónimo" />
        </label>
        <label>
          <span>Usuario</span>
          <input id="profile-username" name="username" type="text" placeholder="usuario" />
        </label>
        <label>
          <span>Biografía</span>
          <textarea id="profile-bio" name="bio" placeholder="Cuéntanos sobre ti..."></textarea>
        </label>
        <button class="btn" type="submit">Guardar perfil</button>
        <div id="profile-status" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="card">
      <h2>Configuración</h2>
      <form id="settings-form">
        <label>
          <span>Tema</span>
          <select name="theme">
            <option value="light">Claro</option>
            <option value="dark">Oscuro</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" name="email_notifications" />
          <span>Recibir notificaciones por email</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" name="public_profile" />
          <span>Perfil público</span>
        </label>
        <button class="btn secondary" type="submit">Guardar configuración</button>
        <div id="settings-status" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
